# F10 — OpenTelemetry Collector configuration (standalone)
#
# Mirrors stack/config/otel-collector/config.yaml; the live backplane stack
# mounts that copy. Keep these two files byte-equivalent on PII-scrubbing
# rules and sampling policy — they are the same contract.
#
# Routes (per F10 prompt):
#   - Traces  → file/parquet (F15 → obs.traces) + Sentry SaaS (errors only)
#   - Metrics → file/parquet (F15 → obs.events with event_type='metric')
#   - Logs    → file/parquet (F15 → obs.events)
#
# Hard prohibitions (F10 prompt):
#   - No PII in attributes — see `processors.transform/scrub_pii` below.
#   - No sampling > 0.1 for non-error traces (see `tail_sampling`).

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # ---------------------------------------------------------------------------
  # Batch — standard recommendation; sized for ARM64 single-node throughput.
  # ---------------------------------------------------------------------------
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # ---------------------------------------------------------------------------
  # Tail-sampling — F10 contract: 1.0 for errors, 0.1 for success.
  # `error-trace` policy uses status_code=ERROR; `slow-trace` keeps anything
  # over 1s (operationally critical even if no explicit error status).
  # ---------------------------------------------------------------------------
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 1000
    policies:
      - name: errors-always
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow-trace
        type: latency
        latency:
          threshold_ms: 1000
      - name: success-sampled
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

  # ---------------------------------------------------------------------------
  # Attribute deletes — drop entire keys known to carry secrets / PII headers.
  # Stage 1 of PII scrubbing.
  # ---------------------------------------------------------------------------
  attributes/scrub_keys:
    actions:
      # Auth / session headers
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.set_cookie
        action: delete
      - key: http.request.header.x_api_key
        action: delete
      - key: http.request.header.x_sitidos_api_key
        action: delete
      - key: http.request.header.proxy_authorization
        action: delete
      - key: http.response.header.set_cookie
        action: delete
      # User-identifying fields (hash → opaque correlation token)
      - key: user.email
        action: hash
      - key: user.phone
        action: hash
      - key: enduser.id
        action: hash
      # API / service tokens
      - key: api.key
        action: delete
      - key: db.statement
        action: delete   # SQL bodies may carry literal PII; structured queries only
      # JWT / OAuth bearer fragments
      - key: messaging.message.id
        action: hash

  # ---------------------------------------------------------------------------
  # Regex scrubbing — Stage 2: redact PII embedded inside free-text attribute
  # values (e.g., URL paths, error messages, log bodies).
  # Patterns covered: email, E.164 phone, credit card (Luhn-shaped 13–19),
  # IBAN, JWT, generic API-key heuristics (`sk_`, `pk_`, `ghp_`, `xoxb-`, etc.).
  # ---------------------------------------------------------------------------
  transform/scrub_pii:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")
          - replace_all_patterns(attributes, "value", "\\+?[1-9]\\d{7,14}", "[REDACTED_PHONE]")
          - replace_all_patterns(attributes, "value", "\\b(?:\\d[ \\-]?){12,18}\\d\\b", "[REDACTED_PAN]")
          - replace_all_patterns(attributes, "value", "\\b[A-Z]{2}\\d{2}[A-Z0-9]{10,30}\\b", "[REDACTED_IBAN]")
          - replace_all_patterns(attributes, "value", "eyJ[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+", "[REDACTED_JWT]")
          - replace_all_patterns(attributes, "value", "\\b(?:sk|pk|rk)_(?:live|test)_[A-Za-z0-9]{16,}", "[REDACTED_APIKEY]")
          - replace_all_patterns(attributes, "value", "\\bghp_[A-Za-z0-9]{30,}\\b", "[REDACTED_GHTOKEN]")
          - replace_all_patterns(attributes, "value", "\\bxox[baprs]-[A-Za-z0-9\\-]{10,}", "[REDACTED_SLACK]")
          - replace_all_patterns(attributes, "value", "\\bAKIA[0-9A-Z]{16}\\b", "[REDACTED_AWS_AK]")
    log_statements:
      - context: log
        statements:
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")
          - replace_all_patterns(attributes, "value", "\\+?[1-9]\\d{7,14}", "[REDACTED_PHONE]")
          - replace_all_patterns(attributes, "value", "\\b(?:\\d[ \\-]?){12,18}\\d\\b", "[REDACTED_PAN]")
          - replace_all_patterns(attributes, "value", "\\b[A-Z]{2}\\d{2}[A-Z0-9]{10,30}\\b", "[REDACTED_IBAN]")
          - replace_all_patterns(attributes, "value", "eyJ[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+", "[REDACTED_JWT]")
          - replace_all_patterns(attributes, "value", "\\b(?:sk|pk|rk)_(?:live|test)_[A-Za-z0-9]{16,}", "[REDACTED_APIKEY]")
          - replace_all_patterns(body, "value", "[A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")
          - replace_all_patterns(body, "value", "\\+?[1-9]\\d{7,14}", "[REDACTED_PHONE]")
          - replace_all_patterns(body, "value", "eyJ[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+", "[REDACTED_JWT]")

  # ---------------------------------------------------------------------------
  # Resource — add deployment.environment + service.namespace + release.
  # ---------------------------------------------------------------------------
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENV}
        action: upsert
      - key: service.namespace
        value: sitidos
        action: upsert
      - key: service.version
        value: ${env:SITIDOS_RELEASE}
        action: upsert

exporters:
  # F15 sink: write batched parquet for parquet-writer to consume.
  file/parquet:
    path: /var/lib/otelcol/spans.parquet
    rotation:
      max_megabytes: 10
      max_days: 1
      max_backups: 10
    format: proto

  # Sentry SaaS — errors only (filtered by tail-sampling above).
  # NOTE: Sentry's OTLP receiver is beta. SENTRY_DSN_KEY is the key portion of
  # the DSN URL; full DSN provisioning is flagged for org-secret per F10 prompt.
  otlphttp/sentry:
    endpoint: https://sentry.io/api/0/envelope/
    headers:
      X-Sentry-Auth: "Sentry sentry_version=7, sentry_key=${env:SENTRY_DSN_KEY}"

  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      # Scrub BEFORE tail-sampling so dropped traces never carry PII through.
      processors: [attributes/scrub_keys, transform/scrub_pii, resource, tail_sampling, batch]
      exporters: [file/parquet, otlphttp/sentry]

    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [file/parquet]

    logs:
      receivers: [otlp]
      processors: [attributes/scrub_keys, transform/scrub_pii, resource, batch]
      exporters: [file/parquet]

  telemetry:
    metrics:
      address: 0.0.0.0:8888
    logs:
      level: info
