# Valkey 8 config for Sitidos perms cache
#
# Pattern: ACL cache keyed by (user_id, workspace_id, generation_cursor),
# 60-second TTL set at write time by the website / RPC layer.
# Eviction kicks in when memory cap hit; LRU is safe because misses just
# re-derive from the Iceberg acl.row_access projection.

bind 0.0.0.0
protected-mode no
port 6379

# Persistence: AOF on, RDB off. Perms cache is rebuildable; AOF gives us
# fast restart without a stale cold cache.
appendonly yes
appendfsync everysec
save ""

# Memory cap: 256MB is plenty for dev; F2 will raise per-workspace at scale.
maxmemory 256mb
maxmemory-policy allkeys-lru

# No auth in dev; the network is Docker-internal only and not exposed beyond
# host 6380. F2 will add ACL users + TLS for prod.

# Keyspace notifications: needed for generation-cursor invalidation events.
notify-keyspace-events Ex
