# Sitidos backplane stack
#
# Linux/ARM64-only base images so this stack is bit-identical between
# this macbook (dev) and the Oracle Always Free ARM Ampere box (prod cutover).
#
# Ports: see README.md. Adjust on the LEFT side of the colon if a host
# port collides; never change the container-side port.
#
# Bring up:    docker compose -f compose/sitidos.yml up -d
# Status:      docker compose -f compose/sitidos.yml ps
# Tail logs:   docker compose -f compose/sitidos.yml logs -f
# Tear down:   docker compose -f compose/sitidos.yml down
# Wipe data:   docker compose -f compose/sitidos.yml down -v && rm -rf data/*/*
#
# Per ADR-0005 stack delta:
#   ADDED:    polaris (F14), otel-collector (F10), parquet-writer (F15), revalidator (F17)
#   REMOVED:  opensearch + opensearch-dashboards (replaced by obs.* Iceberg tables, F15/F16)
#             documenso + documenso-db (moved to private sitidos-esign repo;
#                                       AGPL §13 containment; Iceberg-backed Prisma adapter)

name: sitidos

networks:
  sitidos:
    driver: bridge

services:
  # -------------------------------------------------------------------------
  # F8 — Valkey 8 — cache + invalidation cursors + ISR pub/sub
  # -------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8-alpine
    platform: linux/arm64
    container_name: sitidos-valkey
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - ../data/valkey:/data
      - ../config/valkey/valkey.conf:/etc/valkey/valkey.conf:ro
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [sitidos]

  # -------------------------------------------------------------------------
  # F7 — OpenBao — per-workspace cryptoshred keys (D4) + PKI for e-sign certs
  # Dev mode for now; F7 agent replaces with prod auto-unseal + KV-v2 + PKI roles.
  # -------------------------------------------------------------------------
  openbao:
    image: openbao/openbao:2.4.1
    platform: linux/arm64
    container_name: sitidos-openbao
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=sitidos-dev-root-CHANGE-ME
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - BAO_ADDR=http://0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - ../data/openbao:/openbao/data
      - ../config/openbao:/openbao/config:ro
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [sitidos]

  # -------------------------------------------------------------------------
  # F14 — Apache Polaris — Iceberg catalog (per D3, replaces planned Nessie)
  # Validation memo: apache/polaris:1.5.0 ARM64 PASS (~10 days old at memo time).
  # R2 backend configured via env; bootstrap script at iac/polaris/bootstrap.sh.
  # -------------------------------------------------------------------------
  polaris:
    image: apache/polaris:1.5.0
    platform: linux/arm64
    container_name: sitidos-polaris
    restart: unless-stopped
    environment:
      - POLARIS_BOOTSTRAP_CREDENTIALS=root:secret
      - polaris.persistence.type=eclipse-link
      - polaris.realm-context.realms=sitidos
      - polaris.features."ALLOW_OVERLAPPING_CATALOG_URLS"=true
      - quarkus.log.level=INFO
      # R2 backend (S3-compatible) — populated from sitidos-iac/secrets
      - AWS_REGION=auto
      - AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-CHANGE-ME}
      - AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-CHANGE-ME}
      - AWS_ENDPOINT_URL_S3=${R2_ENDPOINT_URL:-https://CHANGE-ME.r2.cloudflarestorage.com}
    ports:
      - "8181:8181"   # Catalog API
      - "8182:8182"   # Management API (admin only; not exposed externally)
    volumes:
      - ../data/polaris:/var/lib/polaris
      - ../config/polaris:/opt/polaris/config:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8182/q/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [sitidos]

  # -------------------------------------------------------------------------
  # F10 — OpenTelemetry Collector — receives traces/metrics/logs from all services
  # Exports to parquet-writer (Iceberg via F15) and Sentry SaaS.
  # Config at ../config/otel-collector/config.yaml (managed by F10 agent).
  # -------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    platform: linux/arm64
    container_name: sitidos-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../config/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ../data/otel-collector:/var/lib/otelcol  # batched parquet output dir
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector metrics
    environment:
      - SENTRY_DSN=${SENTRY_DSN:-}
    networks: [sitidos]

  # -------------------------------------------------------------------------
  # F15 — parquet-writer sidecar — OTel → Iceberg landing pipeline
  # Consumes batched parquet from otel-collector and commits to Polaris.
  # 30s window or 10MB whichever first (per F15 spec).
  # Image is sitidos-built; placeholder ghcr ref until F15 agent ships v0.1.
  # -------------------------------------------------------------------------
  parquet-writer:
    image: ghcr.io/sitidos/parquet-writer:0.1.0-placeholder
    platform: linux/arm64
    container_name: sitidos-parquet-writer
    restart: unless-stopped
    depends_on:
      polaris:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      - POLARIS_URL=http://polaris:8181
      - POLARIS_REALM=sitidos
      - OPENBAO_URL=http://openbao:8200
      - INPUT_DIR=/var/lib/otelcol
      - BATCH_WINDOW_SECONDS=30
      - BATCH_MAX_BYTES=10485760
    volumes:
      - ../data/otel-collector:/var/lib/otelcol:ro
    profiles: [f15]   # disabled by default until F15 agent ships the image
    networks: [sitidos]

  # -------------------------------------------------------------------------
  # F17 — revalidator sidecar — ISR-at-edge invalidation bus
  # Subscribes to Polaris snapshot events via Valkey pub/sub, computes affected
  # tag set per D7 taxonomy, calls Vercel revalidation API + Cloudflare cache purge.
  # Target: p95 < 800ms commit-to-edge-invalidation.
  # Image is sitidos-built; placeholder until F17 agent ships v0.1.
  # -------------------------------------------------------------------------
  revalidator:
    image: ghcr.io/sitidos/revalidator:0.1.0-placeholder
    platform: linux/arm64
    container_name: sitidos-revalidator
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
      polaris:
        condition: service_healthy
    environment:
      - VALKEY_URL=redis://valkey:6379
      - POLARIS_URL=http://polaris:8181
      - VERCEL_TOKEN=${VERCEL_REVALIDATE_TOKEN:-}
      - VERCEL_PROJECT_ID=${VERCEL_PROJECT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CF_CACHE_PURGE_TOKEN:-}
      - CLOUDFLARE_ZONE_ID=${CF_ZONE_ID:-}
    profiles: [f17]   # disabled by default until F17 agent ships the image
    networks: [sitidos]

  # -------------------------------------------------------------------------
  # LibreOffice headless (unoserver) — Office doc → PDF for DataRoom preview
  # Kept as-is; not affected by ADR-0005 stack delta.
  # -------------------------------------------------------------------------
  unoserver:
    image: ghcr.io/unoconv/unoserver-docker:latest
    platform: linux/arm64
    container_name: sitidos-unoserver
    restart: unless-stopped
    ports:
      - "2003:2003"
    networks: [sitidos]

  # -------------------------------------------------------------------------
  # uts-server — local PAdES-B-T timestamp server (fallback to FreeTSA.org)
  # FreeTSA.org is primary per ADR-0002. This fallback is NOT WIRED yet because
  # there is no prebuilt linux/arm64 image on Docker Hub for kakwa/uts-server.
  # V-DataRoom agent: build from https://github.com/kakwa/uts-server source
  # via a local Dockerfile when FreeTSA-only is no longer acceptable.
  # Until then, this service is intentionally commented out.
  # -------------------------------------------------------------------------
  # uts-server:
  #   build:
  #     context: ../images/uts-server
  #     platforms: [linux/arm64]
  #   container_name: sitidos-uts-server
  #   restart: unless-stopped
  #   profiles: [tsa-fallback]
  #   ports:
  #     - "8318:2020"
  #   volumes:
  #     - ../config/uts-server:/etc/uts-server:ro
  #   networks: [sitidos]
